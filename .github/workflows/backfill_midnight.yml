name: Keirin Midnight Backfill

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: '対象の開催初日 From (YYYY-MM-DD)'
        required: false
        default: '2025-04-01'
      to_date:
        description: '対象の開催初日 To (YYYY-MM-DD)'
        required: false
        default: '2026-10-23'
      limit_days:
        description: '1回で処理する開催日の上限'
        required: false
        default: '100'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary playwright beautifulsoup4
          playwright install chromium

      - name: Run midnight backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BF_FROM: ${{ inputs.from_date }}
          BF_TO: ${{ inputs.to_date }}
          BF_LIMIT_DAYS: ${{ inputs.limit_days }}
        run: |
          python backfill_midnight.py
