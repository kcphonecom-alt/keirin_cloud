name: Keirin Daily Update

on:
  schedule:
    - cron: '0 0 * * *'   # 日本時間 09:00 （朝）
    - cron: '0 3 * * *'   # 日本時間 12:00 （昼）
    - cron: '0 6 * * *'   # 日本時間 15:00 （夕方）
    - cron: '0 9 * * *'   # 日本時間 18:00 （夜）
    - cron: '0 12 * * *'  # 日本時間 21:00 （最終）
    - cron: '45 14 * * *' # 日本時間 23:45 （ミッドナイト結果の当日取り込み）

  workflow_dispatch: # 手動でもポチッと実行できるようにする
    inputs:
      days_offset:
        description: '対象日のオフセット（0=今日, 1=昨日 ※結果の取りこぼし回収用。PRO予想は当日のみ取得可）'
        required: false
        default: '0'

jobs:
  update-race-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary playwright beautifulsoup4
          playwright install chromium

      - name: Run daily update script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS_OFFSET: ${{ inputs.days_offset || '0' }}
        run: |
          python daily_update.py